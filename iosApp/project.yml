name: FluentMaiIOS

options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.2.4
    PRODUCT_NAME: FluentMai
    PRODUCT_BUNDLE_IDENTIFIER: dev.fluentmai.ios
    CODE_SIGN_STYLE: Automatic
    ALWAYS_SEARCH_USER_PATHS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: FluentMai
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/../core/model/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS: "$(inherited) -framework FluentMaiShared"

targets:
  FluentMaiIOS:
    type: application
    platform: iOS
    sources:
      - path: FluentMaiIOS
      - path: ../fixtures/lxns_song_list_fallback.json
        type: file
        buildPhase: resources
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-NO}" = "YES" ]; then
            echo "Skipping duplicate Kotlin framework build requested by the IDE"
            exit 0
          fi
          cd "$SRCROOT/.."
          bash ./gradlew :core:model:embedAndSignAppleFrameworkForXcode --stacktrace
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO

schemes:
  FluentMaiIOS:
    build:
      targets:
        FluentMaiIOS: all
    run:
      config: Debug
    archive:
      config: Release
